[project]
name = "pytorch-study"
version = "0.1.0"
description = "Hands-on PyTorch study notes and examples"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel",
    "jupyterlab",
    "matplotlib",
    "numpy",
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
